pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.firstdark.dev/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Prefer matching local libraries for standalone development of this new port.
['McJtyLib', 'TheOneProbe', 'RFToolsBase'].each { mod ->
    def configured = providers.gradleProperty("mod.${mod}").orNull
    def checkout = configured ? file(configured) : file("../${mod}_fabric")
    if (new File(checkout, 'build.gradle').isFile()) {
        include mod
        project(":${mod}").projectDir = checkout
    }
}
